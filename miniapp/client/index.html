<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maxclaw Tuitui 设置</title>
  <style>
    :root { color-scheme: dark; --bg:#14191d; --surface:#1c2429; --surface2:#232d33; --text:#e7eeeb; --muted:#9aa7a1; --border:#d4e6dc24; --accent:#8fc2ad; --success:#73c49f; --danger:#e78383; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:300px; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:920px; margin:0 auto; padding:28px 24px 56px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1,h2,p { margin:0; } h1 { font-size:24px; } h2 { font-size:16px; margin-bottom:4px; }
    .subtitle { color:var(--muted); margin-top:5px; }
    .badge { border:1px solid var(--border); border-radius:999px; padding:4px 10px; color:var(--muted); white-space:nowrap; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; }
    .wide { grid-column:1/-1; }
    label { display:block; color:var(--muted); margin-top:13px; }
    input,select { width:100%; margin-top:5px; padding:10px 11px; border:1px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); }
    input:focus { outline:2px solid var(--accent); outline-offset:1px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .row > * { flex:1; min-width:120px; }
    button { border:1px solid var(--border); border-radius:8px; padding:9px 13px; color:var(--text); background:var(--surface2); cursor:pointer; }
    button.primary { background:var(--accent); color:#122019; border-color:transparent; font-weight:600; }
    button.danger { color:var(--danger); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
    .status { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:14px; }
    .metric { padding:12px; border-radius:10px; background:var(--surface2); }
    .metric small { display:block; color:var(--muted); } .metric strong { display:block; margin-top:3px; }
    .ok { color:var(--success); } .error { color:var(--danger); }
    .checks { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin-top:14px; }
    .checks label { margin:0; color:var(--text); display:flex; align-items:center; gap:8px; }
    .checks input { width:auto; margin:0; }
    #notice { min-height:22px; margin:12px 0; color:var(--muted); }
    table { width:100%; border-collapse:collapse; margin-top:12px; font-size:12px; } th,td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:top; } th { color:var(--muted); }
    code { color:var(--accent); }
    @media (max-width:600px) { main { padding:20px 14px 40px; } header { display:block; } .badge { display:inline-block; margin-top:12px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>maxclaw Tuitui 设置</h1><p class="subtitle">配置推推 IM 对接、监听器和任务策略。密钥只保存在本机。</p></div>
    <div id="badge" class="badge">检查中…</div>
  </header>
  <div id="notice" role="status"></div>
  <section class="grid">
    <article class="card">
      <h2>推推 IM 凭据</h2><p class="subtitle">填写推推开放平台的 App ID 和 Secret。</p>
      <form id="credentials-form">
        <label>App ID<input id="appid" name="appid" autocomplete="off" required maxlength="256"></label>
        <label>Secret<input id="secret" name="secret" type="password" autocomplete="new-password" required maxlength="4096"></label>
        <div class="actions"><button class="primary" type="submit">保存凭据</button></div>
      </form>
      <p id="credential-status" class="subtitle"></p>
    </article>
    <article class="card">
      <h2>监听器状态</h2><p class="subtitle">安装不会自动启动；启动后才会连接推推 IM。</p>
      <div class="status">
        <div class="metric"><small>监听器</small><strong id="listener-state">检查中…</strong></div>
        <div class="metric"><small>凭据</small><strong id="credential-state">检查中…</strong></div>
        <div class="metric"><small>运行任务</small><strong id="task-count">0</strong></div>
      </div>
      <div class="actions"><button id="refresh" type="button">刷新状态</button><button id="start" class="primary" type="button">启动监听</button><button id="stop" class="danger" type="button">停止监听</button></div>
    </article>
    <article class="card wide">
      <h2>监听器配置</h2><p class="subtitle">保存后下次启动监听器生效；正在运行的监听器请先停止再启动。</p>
      <form id="config-form">
        <div class="row">
          <label>并发任务数<input id="concurrency" type="number" min="1" max="16"></label>
          <label>最大排队数<input id="maxQueue" type="number" min="1" max="256"></label>
          <label>最大附件数<input id="maxAttachments" type="number" min="0" max="20"></label>
        </div>
        <div class="row">
          <label>单个附件上限（MB）<input id="maxAttachmentBytesMB" type="number" min="1" max="100"></label>
          <label>任务超时（秒）<input id="taskTimeoutSeconds" type="number" min="1" max="3600"></label>
          <label>去重窗口（小时）<input id="dedupeWindowHours" type="number" min="1" max="168"></label>
        </div>
        <div class="checks">
          <label><input id="interactiveCards" type="checkbox">启用交互卡片</label>
          <label><input id="agentProgress" type="checkbox">发送执行进度</label>
          <label><input id="commands" type="checkbox">启用斜杠命令</label>
        </div>
        <div class="actions"><button class="primary" type="submit">保存监听器配置</button></div>
      </form>
    </article>
    <article class="card wide">
      <h2>最近任务</h2><div id="tasks">暂无任务</div>
    </article>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const notice = (message, error = false) => { $('notice').textContent = message || ''; $('notice').className = error ? 'error' : ''; };
const api = async (path, options = {}) => { const headers = { ...(options.headers || {}) }; const session = new URLSearchParams(location.search).get('session'); if (session) headers['x-maxclaw-session'] = session; const response = await fetch(path, { cache: 'no-store', ...options, headers }); const text = await response.text(); let data = {}; try { data = text ? JSON.parse(text) : {}; } catch {} if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）`); return data; };
const setNumber = (id, value, fallback) => { $(id).value = Number.isFinite(Number(value)) ? Number(value) : fallback; };
function renderTasks(tasks) { if (!Array.isArray(tasks) || tasks.length === 0) { $('tasks').textContent = '暂无任务'; return; } $('tasks').innerHTML = `<table><thead><tr><th>状态</th><th>路由</th><th>提示</th><th>时间</th></tr></thead><tbody>${tasks.slice(-20).reverse().map(task => `<tr><td>${escapeHtml(task.status)}</td><td>${escapeHtml(task.route)}</td><td>${escapeHtml(task.prompt)}</td><td>${escapeHtml(new Date(task.createdAt).toLocaleString())}</td></tr>`).join('')}</tbody></table>`; }
function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
function applyConfig(config = {}) { setNumber('concurrency', config.concurrency, 2); setNumber('maxQueue', config.maxQueue, 32); setNumber('maxAttachments', config.maxAttachments, 5); setNumber('maxAttachmentBytesMB', (Number(config.maxAttachmentBytes) || 20 * 1024 * 1024) / 1024 / 1024, 20); setNumber('taskTimeoutSeconds', (Number(config.taskTimeoutMs) || 120000) / 1000, 120); setNumber('dedupeWindowHours', (Number(config.dedupeWindowMs) || 24 * 60 * 60 * 1000) / 60 / 60 / 1000, 24); $('interactiveCards').checked = config.interactiveCards !== false; $('agentProgress').checked = config.agentProgress !== false; $('commands').checked = config.commands !== false; const credential = config.credentials || {}; $('credential-status').textContent = credential.configured ? `已配置：${credential.appid || '已隐藏'}` : '尚未配置'; }
async function refreshStatus() { try { const status = await api('/api/status'); const running = Boolean(status.listener?.running); $('badge').textContent = running ? '监听中' : '未启动'; $('badge').className = `badge ${running ? 'ok' : ''}`; $('listener-state').textContent = running ? '运行中' : '未启动'; $('listener-state').className = running ? 'ok' : ''; $('credential-state').textContent = status.configured ? '已配置' : '未配置'; $('credential-state').className = status.configured ? 'ok' : 'error'; $('task-count').textContent = Array.isArray(status.tasks) ? status.tasks.filter(task => task.status === 'running').length : '0'; applyConfig(status.config || {}); renderTasks(status.tasks || []); } catch (error) { notice(error.message, true); } }
$('credentials-form').addEventListener('submit', async (event) => { event.preventDefault(); try { await api('/api/credentials', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ appid:$('appid').value.trim(), secret:$('secret').value }) }); $('secret').value = ''; notice('推推 IM 凭据已安全保存。'); await refreshStatus(); } catch (error) { notice(error.message, true); } });
$('config-form').addEventListener('submit', async (event) => { event.preventDefault(); try { await api('/api/config', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ concurrency:Number($('concurrency').value), maxQueue:Number($('maxQueue').value), maxAttachments:Number($('maxAttachments').value), maxAttachmentBytes:Math.round(Number($('maxAttachmentBytesMB').value) * 1024 * 1024), taskTimeoutMs:Math.round(Number($('taskTimeoutSeconds').value) * 1000), dedupeWindowMs:Math.round(Number($('dedupeWindowHours').value) * 60 * 60 * 1000), interactiveCards:$('interactiveCards').checked, agentProgress:$('agentProgress').checked, commands:$('commands').checked }) }); notice('监听器配置已保存。'); await refreshStatus(); } catch (error) { notice(error.message, true); } });
$('refresh').addEventListener('click', refreshStatus);
$('start').addEventListener('click', async () => { try { await api('/api/listener/start', { method:'POST', headers:{'content-type':'application/json'}, body:'{}' }); notice('监听器已启动。'); await refreshStatus(); } catch (error) { notice(error.message, true); } });
$('stop').addEventListener('click', async () => { try { await api('/api/listener/stop', { method:'POST' }); notice('监听器已停止。'); await refreshStatus(); } catch (error) { notice(error.message, true); } });
refreshStatus();
</script>
</body>
</html>
